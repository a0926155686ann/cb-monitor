<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發債庫藏</title>
<style>
:root{--bg:#000;--hd:#1c2230;--card:#11151c;--tx:#eef1f5;--mu:#9aa5b5;--bd:#2a2f38;--st:#e5322d;--up:#ff4d4f;--dn:#22c55e;--ind:#1fa6d6;--ac:#2b8be0;--warn:#f5a524;--hl:#13202f;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f7;--hd:#e6e9ee;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dde3;--ind:#0b7fae;--up:#d92d20;--dn:#15803d;--warn:#b45309;--hl:#eef5fc;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f5f7;--hd:#e6e9ee;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dde3;--ind:#0b7fae;--up:#d92d20;--dn:#15803d;--warn:#b45309;--hl:#eef5fc;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 display:flex;flex-direction:column;height:100vh;height:100dvh}
/* 上方卡片與篩選固定,只有表格區捲動,表頭用 sticky 固定在表格區頂端 */
.top,.cards,.tools{flex:none}
.top{display:flex;align-items:center;background:var(--hd);padding:0 8px;gap:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.tabs a,.tabs span{padding:12px 14px;white-space:nowrap;color:var(--mu);text-decoration:none}
.tabs .on{color:var(--tx);text-decoration:underline;background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.card b{display:block;font-size:22px}.card small{color:var(--mu)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 12px 10px;color:var(--mu);font-size:13px}
.tools select,.tools input{background:var(--hd);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 8px;font:inherit}
.wrap{flex:1;min-height:0;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
th{background:var(--hd);padding:10px 8px;font-weight:600;cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--bd)}
th .ar{color:var(--ac);font-size:11px}
td{text-align:center;padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.cur td{background:var(--hl)}
.stock{line-height:1.3}
.ind{color:var(--ind)}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.warn{color:var(--warn)}
.tag{display:inline-block;border-radius:3px;padding:1px 6px;font-size:12px;white-space:nowrap}
.t-on{background:var(--st);color:#fff}.t-soon{background:var(--warn);color:#000}.t-end{background:var(--bd);color:var(--mu)}
.small{font-size:12px;color:var(--mu)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-top:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac)}
.empty{padding:40px;color:var(--mu)}
.empty code{background:var(--hd);padding:2px 6px;border-radius:3px}
.mOnly{display:none!important}
.tools button{background:var(--hd);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 8px;font:inherit;cursor:pointer}
/* ===== 手機版(≤640px):每檔 CB 一張卡片 ===== */
@media (max-width:640px){
 body{display:block;height:auto;font-size:14px}
 .tabs a,.tabs span{padding:10px 11px;font-size:14px}
 .top{padding:0}
 .cards{grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
 .card{padding:6px 8px;border-radius:6px}
 .card small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.card b{font-size:17px}
 .card:last-child{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
 .card:last-child small{display:inline}.card:last-child b{font-size:13px!important;display:inline}.card:last-child b br{display:none}
 .mOnly{display:inline-block!important}
 .tools{gap:8px;padding:0 8px 8px}
 .tools>label:not(.keep){display:none}
 .tools.open>label{display:inline-flex;align-items:center;gap:4px}
 .tools .keep{flex:1;display:flex;align-items:center;gap:4px;white-space:nowrap}.tools .keep input{flex:1;min-width:0;width:100%}
 #stat{font-size:12px}
 .wrap{overflow:visible}
 table,tbody{display:block;min-width:0}
 thead{display:block;position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 8px;border-bottom:1px solid var(--bd)}
 thead tr{display:flex;gap:6px;overflow-x:auto}
 th{position:static;box-shadow:none;background:var(--hd);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:normal}
 tbody tr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin:8px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
 tr.cur td{background:none}
 td{border:0;padding:0;text-align:left}
 td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mu)}
 td.stock{grid-column:1/3;order:-2;font-size:16px;font-weight:600}td.stock br{display:none}
 td.stock .ind{font-size:12px;font-weight:normal;margin-left:6px}
 td.st{order:-1;text-align:right}
 td.w2{grid-column:span 2}td.w3{grid-column:1/-1}
 td.big{font-size:17px;font-weight:600}
 td.small{max-width:none!important}
 td[colspan]{grid-column:1/-1;text-align:center}
}
</style>
</head>
<body>
<div class="top">
<div class="tabs"><span>漲幅排序</span><span>CB套利</span><a href="cb-breakout.html">發債突破</a><a href="cb-quotes.html">可轉債</a><span>高殖發債</span><span>動態避險</span><a class="on" href="cb-treasury.html">發債庫藏</a><span>發債籌碼</span><span>發債特價好股</span><span>發債回支撐</span></div>
</div>
<div class="cards">
<div class="card"><small>符合 CB 檔數</small><b id="c1">0</b></div>
<div class="card"><small>現股檔數</small><b id="c2">0</b></div>
<div class="card"><small>買回進行中</small><b id="c3" class="up">0</b></div>
<div class="card"><small>現價在買回區間內</small><b id="c4">0</b></div>
<div class="card"><small>資料時間</small><b id="c5" style="font-size:15px">—</b></div>
</div>
<div class="tools" id="tools">
<button id="fBtn" class="mOnly" type="button">篩選 ▾</button>
<label>狀態 <select id="st"><option value="act">進行中 + 即將開始</option><option value="on">只看進行中</option><option value="soon">只看即將開始</option></select></label>
<label>現價位置 <select id="pos"><option value="">全部</option><option>區間內</option><option>低於區間</option><option>高於區間</option></select></label>
<label>產業 <select id="indSel"><option value="">全部</option></select></label>
<label>發行券商 <select id="uwSel"><option value="">全部</option></select></label>
<label class="keep">搜尋 <input id="q" placeholder="代碼/名稱/產業"></label>
<label><input type="checkbox" id="auto" checked> 自動更新(30 秒)</label>
<span id="stat"></span>
</div>
<div class="wrap"><table><thead><tr id="h"></tr></thead><tbody id="b"></tbody></table></div>
<script>
// [排序鍵, 標題]
const cols=[["status","狀態"],["code","現股"],["chg","漲幅"],["price","現價"],["cbcode","CB"],["cbp","CB價"],
 ["planLots","預計買回"],["maxAmt","金額上限"],["nowPct","目前已買回"],["from","實施庫藏股期間"],["pxLow","買回價格區間"],["purpose","目的"],["prevFrom","上次庫藏股"]];
const $=id=>document.getElementById(id),f=(v,d=2)=>v==null?"--":(+v).toFixed(d);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=[],sk=store.get("tr.sk","daysLeft"),dir=store.get("tr.dir",1),META=null;
const md=s=>s?s.slice(5).replace("-","/"):"",ymd=s=>s?s.replace(/-/g,"/"):"";
const amt=v=>v==null?"--":v>=1e8?(v/1e8).toFixed(1)+" 億":(v/1e4).toFixed(0)+" 萬";
const SO={"進行中":0,"即將開始":1,"已結束":2};
function fillSel(id,vals,none){const el=$(id),cur=el.value,cnt={};vals.forEach(v=>{v=(v||"").trim()||none;cnt[v]=(cnt[v]||0)+1});
 const o=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"zh-Hant")),sig=o.map(x=>x.join(":")).join("|");if(el.dataset.sig===sig)return;el.dataset.sig=sig;
 el.innerHTML='<option value="">全部</option>'+o.map(([v,n])=>`<option value="${v}">${v} (${n})</option>`).join("");el.value=cnt[cur]?cur:""}
function head(){$("h").innerHTML=cols.map(([k,t])=>`<th data-k="${k}">${t}${sk===k?`<span class="ar">${dir>0?"▲":"▼"}</span>`:""}</th>`).join("");
 $("h").querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;dir=sk===k?-dir:1;sk=k;store.set("tr.sk",sk);store.set("tr.dir",dir);go()})}
function rows(){
 fillSel("indSel",D.map(d=>d.ind),"未分類");fillSel("uwSel",D.map(d=>d.uw),"無");
 const st=$("st").value,ps=$("pos").value,is=$("indSel").value,us=$("uwSel").value,q=$("q").value.trim();
 return D.filter(d=>d.status!=="已結束"&&(st==="act"||(st==="on"?d.status==="進行中":d.status==="即將開始"))&&(!ps||d.pos===ps)
  &&(!is||((d.ind||"").trim()||"未分類")===is)&&(!us||((d.uw||"").trim()||"無")===us)
  &&(!q||[d.code,d.name,d.cb,d.cbcode,d.ind].some(x=>(x||"").includes(q))))
  .sort((a,b)=>{const x=sk==="status"?SO[a.status]:a[sk],y=sk==="status"?SO[b.status]:b[sk];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(x>y?1:x<y?-1:0)*dir})}
function cell(d){
 const tag=d.status==="進行中"?"t-on":d.status==="即將開始"?"t-soon":"t-end";
 const left=d.status==="進行中"?`剩 ${d.daysLeft} 天`:d.status==="即將開始"?`${md(d.from)} 開始`:`已結束`;
 const posC=d.pos==="區間內"?"up":d.pos==="低於區間"?"warn":"mu";
 // 目前已買回:執行完畢用 MOPS 結果;執行中用「買回達一定標準」申報的期間累積股數(至少值)
 const bar=p=>`<div class="prog"><i style="width:${Math.min(100,p||0)}%"></i></div>`;
 const exec=d.boughtLots!=null?`${d.boughtLots.toLocaleString()} 張<div class="small">已完畢・執行率 ${f(d.execPct)}%</div>${bar(d.execPct)}`
  :d.nowLots?`<b>${d.nowLots.toLocaleString()}</b> 張${d.nowPct!=null?` <span class="small">(${f(d.nowPct,1)}%)</span>`:""}${bar(d.nowPct)}<div class="small">${amt(d.nowAmt)}・均價 ${f(d.nowAvg)}<br>截至 ${md(d.nowAsOf)}(申報 ${d.nowReports} 次)</div>`
  :d.nowLots===0?`<span class="mu">尚無申報</span><div class="small" title="法規:累積買回達已發行股數 2%,或累積金額達 3 億元(兩者任一)就必須申報。尚無申報代表兩者都還沒達到。">買回未達 2% 也未達 3 億</div>`
  :`<span class="mu">--</span>`;
 const prev=d.prevFrom?`${ymd(d.prevFrom)}<br>~ ${ymd(d.prevTo)}<div class="small">${d.prevPlanLots!=null?d.prevPlanLots.toLocaleString()+" 張":""}${d.prevExecPct!=null?"・執行率 "+f(d.prevExecPct)+"%":""}</div>`:`<span class="mu">近 3 年無</span>`;
 return `<tr class="${d.status==="進行中"?"cur":""}">
 <td class="st"><span class="tag ${tag}">${d.status}</span><div class="small">${left}</div></td>
 <td class="stock">${d.name}<br> ${d.code}${d.ind?`<br><span class="ind">${d.ind}</span>`:""}</td>
 <td data-l="漲幅" class="big ${d.chg>0?"up":d.chg<0?"dn":""}">${f(d.chg)}%</td>
 <td data-l="現價" class="big">${f(d.price)}<div class="small ${posC}">${d.pos||""}</div></td>
 <td data-l="CB">${d.cb}<br>${d.cbcode}</td>
 <td data-l="CB價" class="${d.cbp?"":"mu"}">${f(d.cbp)}${d.premium!=null?`<div class="small">溢價 ${f(d.premium)}%</div>`:""}</td>
 <td data-l="預計買回">${d.planLots!=null?d.planLots.toLocaleString()+" 張":"--"}</td>
 <td data-l="金額上限">${amt(d.maxAmt)}</td>
 <td data-l="目前已買回" class="w3" style="min-width:150px">${exec}</td>
 <td data-l="實施庫藏股期間">${ymd(d.from)}<br>~ ${ymd(d.to)}<div class="small">董事會 ${ymd(d.board)}</div></td>
 <td data-l="買回價格區間">${f(d.pxLow)} ~ ${f(d.pxHigh)}</td>
 <td data-l="目的" class="small" style="max-width:120px">${d.purpose}</td>
 <td data-l="上次庫藏股" class="w3">${prev}</td></tr>`}
function go(){head();
 if(!META){$("b").innerHTML=`<tr><td class="empty" colspan="${cols.length}">尚無資料。請先執行 <code>python scripts\\cb_quotes.py</code>,再重新整理。</td></tr>`;return}
 const r=rows();
 $("b").innerHTML=r.map(cell).join("")||`<tr><td class="empty" colspan="${cols.length}">沒有符合條件的資料</td></tr>`;
 $("c1").textContent=r.length;$("c2").textContent=new Set(r.map(d=>d.code)).size;
 $("c3").textContent=new Set(r.filter(d=>d.status==="進行中").map(d=>d.code)).size;
 $("c4").textContent=new Set(r.filter(d=>d.pos==="區間內").map(d=>d.code)).size;
 $("stat").textContent=`顯示 ${r.length} 筆`}
function load(){const s=document.createElement("script");s.src="data/cb_treasury.js?t="+Date.now();
 s.onload=()=>{const L=window.CB_TREASURY;if(L&&L.rows){META=L;D=L.rows;$("c5").innerHTML=`${L.updated}<br><small>庫藏股資料 ${L.treasDate||""}</small>`;go()}s.remove()};
 s.onerror=()=>{s.remove();go()};document.head.appendChild(s)}
$("fBtn").onclick=()=>{const t=$("tools");t.classList.toggle("open");$("fBtn").textContent=t.classList.contains("open")?"篩選 ▴":"篩選 ▾"};
["st","pos","indSel","uwSel"].forEach(i=>$(i).onchange=go);$("q").oninput=go;
setInterval(()=>{if($("auto").checked)load()},30000);
go();load();
</script>
</body>
</html>
